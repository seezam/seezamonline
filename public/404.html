<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
      // Перенаправление всех 404 на index.html для работы React Router
      const path = window.location.pathname;
      window.history.replaceState({}, document.title, '/seezamonline/' + path.substring(1));
      window.location.href = '/seezamonline/';
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
