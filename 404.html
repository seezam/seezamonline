<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0; url=./" />
    <title>Redirecting...</title>
    <script>
      // Перенаправление всех 404 и якорей без слэша на главную
      const hash = window.location.hash;
      if (hash && !hash.startsWith('#/')) {
        // Якорь без слэша (#services) — перенаправляем на главную
        window.location.href = './';
      } else {
        // Обычное 404
        window.location.href = './';
      }
    </script>
  </head>
  <body>
    <p>Redirecting to main page...</p>
  </body>
</html>
